name: Test
run-name: 'Test: ${{ github.event.pull_request.title || github.event.head_commit.message || github.ref_name }}'

on:
  push:
    branches:
      - main
  pull_request:
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

jobs:
  test:
    name: Lint, Typecheck, and Test (Bun)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version-file: 'package.json'

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Lint
        run: bun run lint:ci

      - name: Typecheck
        run: bun run typecheck

      - name: Test & Coverage
        shell: bash
        env:
          NO_COLOR: "1"
        run: set -o pipefail; bun test --coverage --only-failures 2>&1 | tee coverage.txt

      - name: Create Coverage Summary
        if: always()
        run: |
          if [ -f coverage.txt ]; then
            echo "### Test Coverage Report" >> $GITHUB_STEP_SUMMARY
            echo '```text' >> $GITHUB_STEP_SUMMARY
            sed '/^::/d' coverage.txt | cat -s >> $GITHUB_STEP_SUMMARY
            echo '```' >> $GITHUB_STEP_SUMMARY
          fi
